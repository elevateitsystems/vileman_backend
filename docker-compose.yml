services:
  postgres:
    image: postgres:17
    container_name: vileman_backend_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vileman_backend
      POSTGRES_PASSWORD: vileman_backend
      POSTGRES_DB: vileman_backend_db
    ports:
      - "5435:5432"
    volumes:
      - vileman_backend_data:/var/lib/postgresql/data
    networks:
      - vileman_backend_network

networks:
  vileman_backend_network:
    driver: bridge
    name: vileman_backend_network

volumes:
  vileman_backend_data:
    driver: local
    name: vileman_backend_data
